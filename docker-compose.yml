version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: vedaai-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: vedaai
    volumes:
      - mongodb_data:/data/db
    networks:
      - vedaai-network

  redis:
    image: redis:7-alpine
    container_name: vedaai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - vedaai-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  vedaai-network:
    driver: bridge
